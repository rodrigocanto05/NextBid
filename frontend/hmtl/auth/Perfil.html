<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Comaptible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextBid - Perfil</title>
</head>

<body>
    <a href="index.html">Voltar</a>
    <header>
        <h1>Perfil de Usuário</h1>
    </header>

    <main>
        <section>
            <h3>Foto de Perfil</h3>
            <div id="avatar-preview"
                 style="width:120px;height:120px;border-radius:50%;border:2px solid #888;overflow:hidden;background:linear-gradient(135deg,#2a2d36,#1a1d24);display:flex;align-items:center;justify-content:center;margin-bottom:10px;">
            </div>
            <input type="file" id="avatar-file" accept="image/jpeg,image/png,image/webp" />
            <button type="button" id="avatar-remove">Remover foto</button>
            <p id="avatar-msg" style="font-size:0.85rem;"></p>
        </section>
        <hr>

        <h4>Nome: <span id="profile-nome"></span></h4>
        <br>
        <h4>E-mail: <span id="profile-email"></span></h4>
        <br>
        <h4>XP: <span id="profile-xp"></span></h4>
        <br>
        <h4>Leilões ativos: <span id="profile-leiloes"></span></h4>
        <br>
        <h4>Total de licitações: <span id="profile-licitacoes"></span></h4>
        <br>

        <hr>
        <section>
            <h3>Minhas licitações</h3>
            <p id="bids-loading">A carregar licitações…</p>
            <p id="bids-empty" hidden>Ainda não licitaste em nenhum leilão.</p>
            <p id="bids-error" hidden></p>
            <ul id="profile-bids-list"></ul>
        </section>

        <hr>
        <h3>Atualizar perfil</h3>
        <form id="form-atualizar">
            <input type="email" id="edit-email" placeholder="Novo e-mail (opcional)">
            <br><br>
            <input type="password" id="edit-password" placeholder="Nova password (opcional, mín. 8 chars)">
            <br><br>
            <textarea id="edit-bio" placeholder="Bio (opcional)" rows="3"></textarea>
            <br><br>
            <button type="submit">Guardar alterações</button>
        </form>
        <p id="perfil-msg"></p>

        <br>
        <button id="btn-logout">Terminar sessão</button>
    </main>

    <footer>
        <p>&copy; 2026 NextBid</p>
    </footer>

    <script src="../js/pages/Perfil.js"></script>

</body>

</html>
