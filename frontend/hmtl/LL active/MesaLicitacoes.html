<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextBid - Mesa de Licitações</title>
</head>

<body>
    <nav>
        <a href="LeiloesAtivos.html">Voltar</a>
    </nav>

    <header>
        <h1 id="produto-nome">A carregar...</h1>
        <p id="produto-descricao"></p>
    </header>

    <main>
        <h2>Mesa de Licitações</h2>

        <p><strong>Lance mínimo:</strong> <span id="lance-minimo">...</span></p>
        <p><strong>Tempo restante:</strong> <span id="cronometro">...</span></p>

        <form id="form-licitar">
            <label for="bid-amount">O teu lance (€):</label>
            <br><br>
            <input type="number" id="bid-amount" min="0.01" step="0.01" placeholder="Ex: 50.00" required>
            <br><br>
            <button type="submit">Licitar</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 NextBid</p>
    </footer>

    <script src="../../js/Cronometro.js"></script>
    <script src="../../js/Licitações.js"></script>

</body>

</html>
